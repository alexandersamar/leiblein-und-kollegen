# Vorschau auf GitHub Pages: https://alexandersamar.github.io/leiblein-und-kollegen/
# Bei jedem Push auf main: Build mit PREVIEW=1 (alle Seiten noindex), Adressen auf den Unterordner umschreiben, veröffentlichen.
name: GitHub Pages (Vorschau)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PREVIEW: '1'
      - run: node tools/rebase.mjs dist
        env:
          BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
